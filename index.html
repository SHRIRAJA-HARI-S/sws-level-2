<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>My Web Page</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="left-section">
        <div class="back">← <span>Back</span></div>
        <div class="divider"></div>
        <div class="title">
          <div class="logo-box">📄</div>

          <h2>SWS AI Document Hub</h2>

          <span class="badge">LIVE DEMO</span>
        </div>
      </div>

      <div class="right-section">🔔</div>
    </nav>
    <div class="sub-navbar">
      <div class="sub-container">
        <div class="sub-item active">
          <i class="fa-solid fa-arrow-up-from-bracket"></i>
          <span>Document Upload</span>
        </div>
        <div class="sub-item">
          <i class="fa-solid fa-robot"></i>
          <span>AI Assistant</span>
        </div>
      </div>
    </div>
    <div class="info-banner">
    <i class="fa-solid fa-circle-info"></i>
    <p>
        <strong>Simulated demo</strong> — files are processed client-side only,
        nothing is stored. Upload <strong>1-3 files</strong> to see individual
        per-file progress bars. Upload <strong>4 or more files</strong> to
        trigger the bulk notification flow.
    </p>
</div>
  </body>
</html>
